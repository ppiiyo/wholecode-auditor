[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wholecode-auditor"
version = "0.1.0"
description = "Whole-codebase security auditing via SubQ Snap long context"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["aiohttp==3.9.5", "requests==2.32.3", "python-dotenv==1.0.0"]

[project.scripts]
wholecode = "wholecode.cli:main"

[tool.setuptools.packages.find]
include = ["wholecode*"]
